name: Deploy to GitHub Pages

# main에 푸시하면 빌드해서 Pages로 배포한다.
# 심사 기간 동안 링크가 계속 살아 있어야 하므로 수동 배포에 의존하지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 연속 푸시 시 뒤엣것이 이긴다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 검증기·오디오 신호/런타임·에셋·레이아웃·회피·불변식은 배포 전에 반드시 통과해야 한다.
      # (불변식은 300런 61만 스텝, 약 15초 — 가장 강한 검사인데 체인 밖에 있었다)
      - run: npm test
      - run: npm run audio:test
      - run: npm run audio:runtime:test
      - run: npm run asset:test
      - run: npm run probe
      - run: npm run dodge:test
      - run: npm run invariants
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
