name: Deploy to GitHub Pages

# main에 푸시하면 빌드해서 Pages로 배포한다.
# 심사 기간 동안 링크가 계속 살아 있어야 하므로 수동 배포에 의존하지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 연속 푸시 시 뒤엣것이 이긴다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      # 로컬과 같은 단일 관문을 쓴다. 6축 중 하나라도 실패하면 Pages도 나가지 않는다.
      - run: npm run verify
      - name: 검증 원시·구조화 증거 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: |
            .omx/evidence/
            docs/generated/metrics-current.json
            docs/generated/metrics-current.md
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
