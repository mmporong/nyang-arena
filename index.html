<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>냥 아레나 — Nyang Arena</title>
    <!-- 인라인 SVG 파비콘. 별도 요청이 생기지 않는다. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>"
    />
    <meta
      name="description"
      content="픽셀 고양이 오토배틀러. 배치하고, 관전하고, 몇 웨이브까지 버티는지 겨루세요."
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #17110e;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        /* viewport-fit=cover를 썼으므로 노치·홈 인디케이터를 피해야 한다.
           패딩을 여기서 주면 clientWidth/Height가 안전영역만 잡아
           레이아웃 계산은 그대로 두어도 된다. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      canvas {
        display: block;
        touch-action: none;
        image-rendering: pixelated;
        cursor: default;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #9c8b76;
        font-size: 14px;
        letter-spacing: 0.08em;
        background: #17110e;
        transition: opacity 0.3s;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">고양이 부르는 중</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
