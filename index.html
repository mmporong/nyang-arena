<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; webrtc 'block'; form-action 'none'; base-uri 'none'; object-src 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>냥 아레나 — Nyang Arena</title>
    <!-- 인라인 SVG 파비콘. 별도 요청이 생기지 않는다. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>"
    />
    <meta
      name="description"
      content="픽셀 고양이 오토배틀러. 배치하고, 관전하고, 몇 웨이브까지 버티는지 겨루세요."
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #17110e;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        /* viewport-fit=cover를 썼으므로 노치·홈 인디케이터를 피해야 한다.
           패딩을 여기서 주면 clientWidth/Height가 안전영역만 잡아
           레이아웃 계산은 그대로 두어도 된다. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      canvas {
        display: block;
        /* 한 손가락 배치 드래그는 게임이 받고, 두 손가락 확대는 브라우저에 남긴다. */
        touch-action: pinch-zoom;
        image-rendering: pixelated;
        cursor: default;
      }
      canvas:focus-visible {
        outline: 3px solid #f0ba4a;
        outline-offset: -5px;
      }
      .game-a11y-controls {
        position: fixed;
        z-index: 20;
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        display: grid;
        max-width: min(720px, calc(100vw - 24px));
        max-height: min(720px, calc(100vh - 24px));
        overflow: auto;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
        color: #efe0c6;
        background: #241a14;
        border: 2px solid #9c8b76;
        border-radius: 10px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.48);
      }
      .game-a11y-controls[hidden],
      .game-a11y-controls [hidden] {
        display: none;
      }
      .game-a11y-controls:not(:focus-within) {
        width: 1px;
        height: 1px;
        max-width: 1px;
        max-height: 1px;
        overflow: hidden;
        padding: 0;
        border: 0;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .game-a11y-controls h2 {
        margin: 0;
        color: #f0ba4a;
        font-size: 18px;
        line-height: 1.25;
      }
      .game-a11y-controls p {
        margin: 0;
        line-height: 1.45;
      }
      .game-a11y-actions,
      .game-a11y-global {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
        gap: 12px;
      }
      .game-a11y-board {
        display: grid;
        gap: 8px;
        padding-top: 12px;
        border-top: 1px solid rgba(239, 224, 198, 0.22);
      }
      .game-a11y-row {
        display: grid;
        grid-template-columns: repeat(5, minmax(44px, 1fr));
        gap: 8px;
      }
      .game-a11y-controls button {
        min-width: 44px;
        min-height: 44px;
        padding: 10px 14px;
        color: #241a14;
        background: #efe0c6;
        border: 2px solid #f5a03c;
        border-radius: 8px;
        font: inherit;
        line-height: 1.35;
        cursor: pointer;
      }
      .game-a11y-board button {
        padding: 6px;
      }
      .game-a11y-controls button:hover {
        background: #fff0d6;
      }
      .game-a11y-controls button:active {
        transform: translateY(1px);
      }
      .game-a11y-controls button:focus-visible {
        outline: 3px solid #f0ba4a;
        outline-offset: 3px;
      }
      .game-a11y-controls button[aria-pressed="true"],
      .game-a11y-controls button[aria-selected="true"] {
        background: #f0ba4a;
        border-color: #fff0d6;
      }
      .game-a11y-controls button:disabled {
        color: #9c8b76;
        background: #30251e;
        border-color: #5f5145;
        cursor: not-allowed;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #9c8b76;
        font-size: 14px;
        letter-spacing: 0.08em;
        background: #17110e;
        transition: opacity 0.3s;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      @media (max-width: 599px), (max-height: 540px) {
        .game-a11y-controls {
          top: max(8px, env(safe-area-inset-top));
          left: max(8px, env(safe-area-inset-left));
          max-width: calc(100vw - 16px);
          max-height: calc(100vh - 16px);
          gap: 8px;
          padding: 12px;
        }
        .game-a11y-actions,
        .game-a11y-global {
          gap: 8px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot,
        .game-a11y-controls,
        .game-a11y-controls button {
          transition: none !important;
        }
        .game-a11y-controls button:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">고양이 부르는 중</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
